arrow (or shading) to the right. The right end is the edge of the picture, not a second endpoint."},{"type":"example","title":"Open inequality","setup":"How is x > 3 graphed, and what is it in interval notation?","steps":["> does not include 3 → open dot at 3.","Greater → shade right.","Interval: (3, ∞). A square bracket on 3 would be x ≥ 3, the wrong inequality. A square bracket on ∞ is illegal."],"answer":"Open dot at 3, shade right. Interval (3, ∞)."},{"type":"example","title":"Closed on the left side","setup":"Which of the following is true for x ≤ −1?","steps":["≤ includes the endpoint: −1 is in the solution. Filled dot at −1.","Less than −1 means left on the number line.","This includes −1.5, −8, −100.1 — not just the integers.","Interval: (−∞, −1]."],"answer":"−1 is included, and every real number to the left of −1 is included."},{"type":"visual","visual":{"kind":"number-line","min":-6,"max":4,"from":-6,"to":-1,"closedLeft":false,"closedRight":true},"caption":"x ≤ −1: filled dot at −1, shading to the left."},{"type":"callout","tone":"tip","body":"Read the inequality as a sentence about x. “x is greater than 3” shades right, even though the symbol > points left. Do not let the pointy end pick the shade direction by itself."},{"type":"shortcut","title":"C955 Shortcut","body":"Filled dot = include = [ ]. Open dot = exclude = ( ). Right = greater. Left = less. Infinity always gets a parenthesis."},{"type":"trap","title":"Common Trap","body":"Using an open dot for ≥, or a filled dot for >. Matching [2, ∞) to x > 2. Putting a square bracket on infinity. Thinking the solution is only the integers."},{"type":"watch","words":[">","<","≥","≤","closed dot","open dot","interval","[","]","infinity"],"body":"Closed / filled / [ ] / “or equal to” all mean include the endpoint. Open / hollow / ( ) / strict inequality all mean exclude it. Shade direction comes from greater vs less, not from which way the symbol points."}]},{"id":"multiplication-rule","slug":"multiplication-rule","concept":"multiplication-rule","title":"Multiplication Rule","subtitle":"Independent sequences like (1/2)^n — and when you must not use that","minutes":12,"order":14,"sections":[{"type":"intro","body":"The multiplication rule is AND, stretched across n independent trials. A specific sequence of fair coin flips is (1/2)^n. A specific face on a fair die, n times, is (1/6)^n. The moment the trials are not independent — without replacement, a bag that shrinks — you still multiply, but the factors are no longer equal."},{"type":"bullets","title":"When the power notation is legal","items":["Independent identical trials: P(all n succeed) = [P(one success)]^n.","Fair coin, n heads in a row: (1/2)^n. Six heads: (1/2)^6 = 1/64.","Fair six-sided die, a specific face n times: (1/6)^n. Two 6s: 1/36. Three 1s: 1/216.","Independent guesses on k-option items: (1/k)^n.","If the second trial is not a reset — the card is not replaced, the marble stays out — do not raise the first fraction to a power. Write the changed second fraction and multiply."]},{"type":"formula","title":"Independent identical trials","formula":"P(specific sequence of n independent trials) = [P(one trial)]^n","note":"This is the general multiplication rule P(A and B and C) = P(A)×P(B)×P(C) after independence lets every factor stay the same."},{"type":"formula","title":"When independence fails","formula":"P(A then B) = P(A) × P(B | A)  with P(B | A) ≠ P(B)","note":"Still a product. Not a power. Cards without replacement: (4/52)×(3/51), never (4/52)^2."},{"type":"example","title":"Six heads","setup":"A fair coin is flipped 6 times. What is P(HHHHHH) — heads every time?","steps":["Independent flips, P(H) = 1/2 each time.","(1/2)^6 = 1/64.","There are 2^6 = 64 possible H/T sequences of length 6; exactly one of them is all heads."],"answer":"1/64"},{"type":"example","title":"A die, twice and three times","setup":"A fair six-sided die is rolled twice. P(6 then 6)? Same die three times: P(all three rolls show a 1)?","steps":["Two independent 6s: (1/6) × (1/6) = 1/36.","Three independent 1s: (1/6)^3 = 1/216."],"answer":"1/36 and 1/216"},{"type":"example","title":"Independent guesses","setup":"A multiple-choice item has 4 options. If you guess 3 such items independently, P(all three correct)?","steps":["P(correct on one guess) = 1/4.","Independent: (1/4) × (1/4) × (1/4) = 1/64."],"answer":"1/64"},{"type":"example","title":"When you must not power the first fraction","setup":"Two cards are drawn without replacement from a 52-card deck. Why is P(two kings) NOT equal to (4/52)×(4/52)?","steps":["Without replacement, the second draw is dependent.","After a king leaves: 3 kings left, 51 cards left.","The correct product is (4/52) × (3/51), not (4/52)^2 = 1/169.","(4/52)^2 would be the with-replacement (or two independent decks) version."],"answer":"The second draw is dependent — only 3 kings and 51 cards remain, so use (4/52)×(3/51)."},{"type":"callout","tone":"info","body":"A specific order is one sequence. “Exactly two heads in three flips” is several sequences (HHT, HTH, THH) and you add those products. This lesson is the single-sequence version; do not silently switch to “exactly k.”"},{"type":"shortcut","title":"C955 Shortcut","body":"A specific sequence of n fair coin flips: 1/2^n. Only raise a fraction to a power when the trial is reset (replacement / independent). Otherwise write each changed factor and multiply the chain."},{"type":"trap","title":"Common Trap","body":"Using 1/6 for six heads (treating it like a six-sided die). Using (4/52)^2 for cards that are not replaced. Reporting 1/n because there were n trials. Adding the piece probabilities instead of multiplying them."},{"type":"watch","words":["in a row","every time","all n","independent","without replacement","specific sequence","flipped n times"],"body":"“All heads,” “in a row,” “every time,” “n times” on a resettable trial → raise to the n. “Without replacement” / “not put back” → do not raise to a power; change the second factor."}]}],"FLASHCARDS":[{"id":"fc-given","front":"GIVEN THAT","back":"Conditional probability. The given group becomes the denominator. P(A | B) = P(A AND B) / P(B).","hint":"Look for: given, among those who, of the people who","concept":"conditional"},{"id":"fc-or","front":"OR","back":"Add the probabilities, then subtract the overlap. P(A OR B) = P(A) + P(B) − P(A AND B).","hint":"If you skip the subtraction you double-count.","concept":"or-probability"},{"id":"fc-and","front":"AND / THEN / followed by / both","back":"Multiply. Independent: P(A)×P(B). Dependent: P(A)×P(B|A).","concept":"and-probability"},{"id":"fc-wor","front":"WITHOUT REPLACEMENT","back":"The total drops. Ask: did the favorable count drop too? Then multiply the chain.","concept":"without-replacement"},{"id":"fc-indep","front":"INDEPENDENT","back":"Knowing A happened does NOT change P(B). Test: P(B) = P(B|A).","concept":"independent-dependent"},{"id":"fc-dep","front":"DEPENDENT","back":"Knowing A happened DOES change P(B). P(B) ≠ P(B|A). Without replacement is dependent.","concept":"independent-dependent"},{"id":"fc-prime","front":"PRIME NUMBER","back":"Exactly two distinct positive factors: 1 and itself. 2 is the only even prime. 1 is not prime.","concept":"prime-composite"},{"id":"fc-comp","front":"COMPOSITE NUMBER","back":"Has at least one extra factor besides 1 and itself (3+ factors). 1 is not composite.","concept":"prime-composite"},{"id":"fc-one","front":"WHY 1 IS NEITHER","back":"Prime needs exactly two factors. Composite needs three or more. 1 has only one factor: itself.","concept":"prime-composite"},{"id":"fc-complement","front":"COMPLEMENT","back":"P(not A) = 1 − P(A). Add what you know, subtract from 1.","concept":"basic-probability"},{"id":"fc-relfreq","front":"RELATIVE FREQUENCY","back":"Count of times it happened ÷ number of trials. An empirical probability.","concept":"basic-probability"},{"id":"fc-mean","front":"MEAN","back":"The arithmetic average. On a normal curve it sits at the center peak."},{"id":"fc-median","front":"MEDIAN","back":"The middle value when data are ordered. For a true normal, mean = median = mode."},{"id":"fc-mode","front":"MODE","back":"The most frequent value. On a normal curve, the peak."},{"id":"fc-sd","front":"STANDARD DEVIATION","back":"Typical distance from the mean. The empirical rule counts in units of SD: 1 → 68%, 2 → 95%, 3 → 99.7%.","concept":"empirical-rule"},{"id":"fc-emp","front":"68-95-99.7","back":"Normal data: ~68% within 1 SD, ~95% within 2 SD, ~99.7% within 3 SD of the mean.","concept":"empirical-rule"},{"id":"fc-r","front":"CORRELATION r","back":"−1 ≤ r ≤ 1. Sign = direction. |r| = strength. 0 = no linear pattern. r is often NOT printed on the scatterplot.","concept":"correlation"},{"id":"fc-reg","front":"REGRESSION ŷ = a + bx","back":"a = intercept (predicted y when x = 0). b = slope (change in ŷ when x increases by 1). Plug x in to predict.","concept":"regression"},{"id":"fc-rational","front":"RATIONAL","back":"Can be written as a fraction of integers. Includes terminating and repeating decimals. 1/2, −4, 0.75, 0.333…","concept":"number-systems"},{"id":"fc-irrational","front":"IRRATIONAL","back":"Real but not a ratio of integers. Non-repeating, non-terminating decimals. √2, π, e, √3. √4 = 2 is rational.","concept":"number-systems"},{"id":"fc-integer","front":"INTEGER","back":"… −2, −1, 0, 1, 2 … No fractional part. Negatives are allowed.","concept":"number-systems"},{"id":"fc-mut-excl","front":"MUTUALLY EXCLUSIVE","back":"Cannot happen at the same time. Overlap = 0, so P(A OR B) = P(A)+P(B). Not the same as independent.","concept":"or-probability"},{"id":"fc-joint","front":"JOINT vs MARGINAL vs CONDITIONAL","back":"Joint = one cell / grand total. Marginal = a row or column total / grand total. Conditional = cell / that group's total.","concept":"two-way-tables"},{"id":"fc-z","front":"Z-SCORE","back":"z = (x − mean) / SD. How many SDs above (+) or below (−) the mean.","concept":"empirical-rule"},{"id":"fc-p-range","front":"VALID PROBABILITY","back":"Always between 0 and 1 inclusive. 0 = impossible. 1 = certain. 1.2 cannot be a probability.","concept":"basic-probability"},{"id":"fc-interval","front":"INTERVAL NOTATION","back":"[ ] includes the end. ( ) excludes it. Infinity always gets a parenthesis: [2, ∞) means x ≥ 2.","concept":"inequalities"},{"id":"fc-natural","front":"NATURAL vs WHOLE","back":"Naturals: 1, 2, 3, … (counting). Wholes: 0, 1, 2, 3, … Zero is whole, not natural, in this course's hierarchy.","concept":"number-systems"},{"id":"fc-placebo-word","front":"PERCENTAGE OF PLACEBO WHO PASSED","back":"Denominator is the placebo group, not the grand total. If 28 of 41 placebo passed → 28/41.","concept":"conditional"},{"id":"fc-causation","front":"CORRELATION vs CAUSATION","back":"A strong r means they move together linearly. It does not prove that one causes the other.","concept":"correlation"},{"id":"fc-sample-space","front":"SAMPLE SPACE","back":"The complete list of possible outcomes. Probabilities over the whole sample space add to 1.","concept":"basic-probability"}],"TRICKS":[{"id":"given","title":"GIVEN = denominator","body":"The group after “given that”, “among those who”, or “of the people who” becomes the whole world. Divide by that group, not the grand total.","watch":"given that · among those who · of the [group] who"},{"id":"or","title":"OR = ADD, subtract the overlap","body":"P(A OR B) = P(A) + P(B) − P(A AND B). You subtract because the overlap was counted twice. If they cannot happen together, the overlap is 0 and you just add.","watch":"or · either · at least one"},{"id":"and","title":"AND = MULTIPLY","body":"“And”, “then”, “followed by”, “both” usually mean multiply. Independent: P(A)×P(B). Dependent: P(A)×P(B|A).","watch":"and · then · followed by · both"},{"id":"wor","title":"WITHOUT REPLACEMENT = TOTAL DROPS","body":"Ask three questions: What changed? Did the total change? Did the favorable count change? Then multiply the chain.","watch":"without replacement · not replaced · then another"},{"id":"indep","title":"Independent = probability DOESN’T CHANGE","body":"If P(B) = P(B|A), A told you nothing new about B. That’s independence. If the numbers differ, they are dependent."},{"id":"dep","title":"Dependent = probability CHANGES","body":"Without replacement is the classic dependent story. Drawing a card changes the deck, so the next probability is different."},{"id":"emp","title":"68-95-99.7","body":"Normal / mound-shaped data: about 68% within 1 SD of the mean, 95% within 2 SD, 99.7% within 3 SD. Distance from mean ÷ SD = number of SDs."},{"id":"complement","title":"Add what you know → subtract from 1","body":"A complete list of outcomes has total probability 1. Missing piece = 1 − (sum of the listed pieces). NOT A is the same idea: 1 − P(A)."},{"id":"prime","title":"1 is not prime. 2 is the only even prime.","body":"Prime = exactly two factors. List the primes first, then divide by the number of faces. Don’t try to count and divide in one messy step."},{"id":"table","title":"Of THIS group → that group’s total","body":"“What percentage of placebo participants passed?” Placebo total is the denominator. Grand total is only for questions about everyone."},{"id":"r","title":"Sign first, then strength","body":"Upward cloud → positive r. Downward → negative. Tight line → |r| near 1. Fuzzy blob → |r| near 0. The number r often is not printed on the plot."},{"id":"reg","title":"Plug x into ŷ = a + bx","body":"Multiply x by the slope, add the intercept. If r is sitting next to the equation and nobody asked for it, ignore r."},{"id":"excl","title":"Mutually exclusive ≠ independent","body":"Mutually exclusive: cannot happen together (overlap 0). Independent: one doesn’t change the other’s probability. If two events with P>0 are exclusive, they are dependent."},{"id":"z","title":"z = (x − mean) / SD","body":"Convert a raw score into “how many SDs from the mean.” Negative means below the mean."},{"id":"interval","title":"Filled dot includes. Open dot excludes.","body":"≥ and ≤ get filled dots / square brackets. > and < get open dots / parentheses. Infinity always gets a parenthesis."},{"id":"rational","title":"Repeating decimals are rational","body":"0.333… = 1/3. Terminating and repeating decimals can be written as fractions. √2 and π cannot."}],"CONCEPT_META":{"basic-probability":{"title":"Basic Probability","short":"Favorable / total","blurb":"Fractions, decimals, percents, complements, and missing probabilities.","color":"accent"},"prime-composite":{"title":"Primes & Composites","short":"Factors first","blurb":"Identify primes, skip 1, then compute probability.","color":"accent"},"or-probability":{"title":"OR Probability","short":"Add, subtract overlap","blurb":"Unions, Venn overlap, mutually exclusive events.","color":"accent"},"and-probability":{"title":"AND / THEN","short":"Multiply","blurb":"Independent products and the general multiplication rule.","color":"accent"},"without-replacement":{"title":"Without Replacement","short":"The bag changes","blurb":"Dependent draws: totals drop, and sometimes the favorable count too.","color":"accent"},"conditional":{"title":"Conditional Probability","short":"GIVEN = denominator","blurb":"Restrict the sample space to the given group.","color":"accent"},"two-way-tables":{"title":"Two-Way Tables","short":"Read the margins","blurb":"Joints, marginals, and 'of this group' percents.","color":"accent"},"independent-dependent":{"title":"Independent vs Dependent","short":"Did P change?","blurb":"Compare P(B) with P(B|A). Equal means independent.","color":"accent"},"empirical-rule":{"title":"Empirical Rule","short":"68-95-99.7","blurb":"Normal curves, SD windows, and simple z-scores.","color":"accent"},"correlation":{"title":"Scatterplots & r","short":"Sign then strength","blurb":"Estimate r from the cloud. r lives in [−1, 1].","color":"accent"},"regression":{"title":"Least-Squares Regression","short":"ŷ = a + bx","blurb":"Plug in x. Slope vs intercept. Ignore extra r.","color":"accent"},"number-systems":{"title":"Number Systems","short":"ℕ ⊂ W ⊂ ℤ ⊂ ℚ ⊂ ℝ","blurb":"Naturals through reals, plus irrationals like √2 and π.","color":"accent"},"inequalities":{"title":"Inequalities","short":"Open vs closed","blurb":"Number lines, filled dots, and interval notation.","color":"accent"},"multiplication-rule":{"title":"Multiplication Rule","short":"Repeated trials","blurb":"Independent sequences like (1/2)^n, and when not to.","color":"accent"}},"QUIZ_MODES":{"quick-10":{"title":"Quick 10","blurb":"A short mixed set. Immediate explanations.","count":10,"timed":false,"immediate":true},"quick-20":{"title":"Quick 20","blurb":"Twenty mixed items. Immediate explanations.","count":20,"timed":false,"immediate":true},"probability":{"title":"Probability Drill","blurb":"Basic, OR, AND, and without replacement.","count":15,"timed":false,"immediate":true,"concepts":["basic-probability","or-probability","and-probability","without-replacement","prime-composite"]},"conditional":{"title":"Conditional Drill","blurb":"Given that, among those who, two-way tables.","count":12,"timed":false,"immediate":true,"concepts":["conditional","two-way-tables"]},"independent":{"title":"Independent vs Dependent","blurb":"Did the probability change? That's the whole game.","count":12,"timed":false,"immediate":true,"concepts":["independent-dependent"]},"normal":{"title":"Normal Distribution Drill","blurb":"68-95-99.7, ranges, and z-scores.","count":12,"timed":false,"immediate":true,"concepts":["empirical-rule"]},"scatter":{"title":"Scatterplot Drill","blurb":"Read the cloud. Estimate r. Sign then strength.","count":10,"timed":false,"immediate":true,"concepts":["correlation"]},"regression":{"title":"Regression Drill","blurb":"Plug into ŷ = a + bx. Ignore extra numbers.","count":10,"timed":false,"immediate":true,"concepts":["regression"]},"mixed":{"title":"Mixed C955","blurb":"Everything, shuffled. Forces you to recognize the type.","count":25,"timed":false,"immediate":true},"weak":{"title":"Weak Areas","blurb":"Pulled from the concepts you miss most.","count":12,"timed":false,"immediate":true},"boss":{"title":"Boss Battle","blurb":"HARD and BOSS items only. Immediate teaching after each.","count":12,"timed":false,"immediate":true,"difficulties":["HARD","BOSS"]},"exam":{"title":"Exam Simulation","blurb":"C955 Practice Simulation — Not an Official WGU Exam. No hints until the end.","count":40,"timed":true,"seconds":3600,"immediate":false,"exam":true}}};
const KEY = "c955-mastery-v1";
const CONCEPTS = Object.keys(DATA.CONCEPT_META);
function emptyC(){const d={attempted:0,correct:0,byDifficulty:{EASY:{attempted:0,correct:0},MEDIUM:{attempted:0,correct:0},HARD:{attempted:0,correct:0},BOSS:{attempted:0,correct:0}}}; const by={}; CONCEPTS.forEach(c=>by[c]={...d,byDifficulty:{EASY:{...d.byDifficulty.EASY},MEDIUM:{...d.byDifficulty.MEDIUM},HARD:{...d.byDifficulty.HARD},BOSS:{...d.byDifficulty.BOSS}}}); return by;}
function defP(){return {version:1,attempted:0,correct:0,streak:0,bestStreak:0,studySeconds:0,sessions:0,lastSessionAt:null,byConcept:emptyC(),missed:[],seenIds:[],quizHistory:[],bestExamPct:null,badges:[]};}
function loadP(){try{const r=JSON.parse(localStorage.getItem(KEY)); if(!r||r.version!==1) return defP(); return Object.assign(defP(), r, {byConcept:Object.assign(emptyC(), r.byConcept||{})});}catch{return defP();}}
let P = loadP();
function saveP(){localStorage.setItem(KEY, JSON.stringify(P));}
function acc(c,a){return a? Math.round(1000*c/a)/10 : null;}
function shuffle(a){const x=a.slice(); for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]];} return x;}
function weak(){return CONCEPTS.map(id=>{const c=P.byConcept[id]; return {id, attempted:c.attempted, correct:c.correct, acc:acc(c.correct,c.attempted)};}).filter(x=>x.attempted>=3 && x.acc!=null).sort((a,b)=>a.acc-b.acc);}
function record(q, ok, chosen){
  const c = P.byConcept[q.concept]; c.attempted++; if(ok) c.correct++;
  const dd=c.byDifficulty[q.difficulty]; dd.attempted++; if(ok) dd.correct++;
  P.attempted++; if(ok) P.correct++; P.streak = ok? P.streak+1 : 0; P.bestStreak=Math.max(P.bestStreak,P.streak);
  if(!ok) P.missed = [{questionId:q.id, at:Date.now(), chosen}, ...P.missed.filter(m=>m.questionId!==q.id)].slice(0,80);
  else P.missed = P.missed.filter(m=>m.questionId!==q.id);
  if(!P.seenIds.includes(q.id)) P.seenIds=[...P.seenIds,q.id].slice(-500);
  saveP();
}
function hash(){return location.hash.replace(/^#/, '') || '/';}
function go(path){location.hash = path; render();}
function esc(s){return String(s??'').replace(/[&<>"']/g, m=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[m]));}
function fmtTime(s){s=Math.max(0,s|0); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0');}
function fmtDur(s){s=Math.max(0,s|0); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); if(h) return h+'h '+m+'m'; if(m) return m+'m'; return s+'s';}

const NAV=[["/" ,"Home"],["/learn","Learn"],["/quiz","Quiz"],["/flashcards","Cards"],["/tricks","Tricks"],["/cheatsheet","Sheet"],["/calculators","Calc"],["/progress","Progress"]];
function nav(path){
  return NAV.map(([p,l])=>`<a href="#${p}" class="${path===p || (p!=='/' && path.startsWith(p)) ? 'active':''}">${l}</a>`).join('');
}

let quiz=null;

function pick(mode){
  const spec = DATA.QUIZ_MODES[mode];
  let pool = DATA.QUESTIONS.slice();
  if(spec.concepts) pool = pool.filter(q=>spec.concepts.includes(q.concept));
  if(spec.difficulties) pool = pool.filter(q=>spec.difficulties.includes(q.difficulty));
  if(mode==='weak'){ const w=weak().slice(0,4).map(x=>x.id); if(w.length){ const f=DATA.QUESTIONS.filter(q=>w.includes(q.concept)); if(f.length>=6) pool=f; } }
  const missed=new Set(P.missed.map(m=>m.questionId));
  const retry=shuffle(pool.filter(q=>missed.has(q.id)));
  const unseen=shuffle(pool.filter(q=>!P.seenIds.includes(q.id)));
  const rest=shuffle(pool);
  const out=[]; const used=new Set();
  const push=q=>{ if(!used.has(q.id)){ used.add(q.id); out.push({...q, choices:shuffle(q.choices)}); } };
  retry.forEach(q=>{ if(out.length<Math.ceil(spec.count*0.35)) push(q); });
  (unseen.length?unseen:rest).forEach(q=>{ if(out.length<spec.count) push(q); });
  rest.forEach(q=>{ if(out.length<spec.count) push(q); });
  return { spec, mode, qs: shuffle(out).slice(0, spec.count), i:0, chosen:null, phase:'ask', log:[], left: spec.seconds||0, t0:Date.now() };
}
function drill(concept){
  const pool=DATA.QUESTIONS.filter(q=>q.concept===concept);
  return { spec:{title: DATA.CONCEPT_META[concept].title+' drill', immediate:true, timed:false, exam:false, count:12}, mode:'drill', qs:shuffle(pool).slice(0,12).map(q=>({...q, choices:shuffle(q.choices)})), i:0, chosen:null, phase:'ask', log:[], left:0, t0:Date.now() };
}

function visual(v){
  if(!v) return '';
  if(v.kind==='table'){
    return `<div class="card" style="overflow:auto"><table style="width:100%;font-size:13px;text-align:left">
      <tr><th></th>${v.columns.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr>
      ${v.rows.map(r=>'<tr><td><b>'+esc(r.label)+'</b></td>'+r.values.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')}
      ${v.totals?'<tr><td><b>Total</b></td>'+v.totals.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>':''}
    </table></div>`;
  }
  if(v.kind==='venn'){
    return `<svg viewBox="0 0 360 180" style="width:100%;max-width:420px;display:block;margin:8px auto">
      <circle cx="140" cy="90" r="62" fill="rgba(94,234,212,.15)" stroke="#5eead4"/>
      <circle cx="220" cy="90" r="62" fill="rgba(52,211,153,.1)" stroke="#34d399"/>
      <text x="115" y="88" text-anchor="middle" fill="#e8eaef" font-size="16">${v.onlyA}</text>
      <text x="180" y="88" text-anchor="middle" fill="#5eead4" font-size="16">${v.both}</text>
      <text x="245" y="88" text-anchor="middle" fill="#e8eaef" font-size="16">${v.onlyB}</text>
      <text x="110" y="28" text-anchor="middle" fill="#8b93a7" font-size="11">${esc(v.aLabel)}</text>
      <text x="250" y="28" text-anchor="middle" fill="#8b93a7" font-size="11">${esc(v.bLabel)}</text>
    </svg>`;
  }
  if(v.kind==='hierarchy'){
    return ['Real numbers ℝ','Rational + Irrational','Integers ℤ','Whole numbers','Natural numbers ℕ'].map((l,i)=>`<div class="card" style="margin-left:${i*12}px;padding:10px">${l}</div>`).join('');
  }
  if(v.kind==='number-line'){
    const X=x=>24+((x-v.min)/(v.max-v.min))*312;
    let ticks=''; for(let t=v.min;t<=v.max;t++) ticks+=`<line x1="${X(t)}" y1="40" x2="${X(t)}" y2="48" stroke="#8b93a7"/><text x="${X(t)}" y="68" text-anchor="middle" font-size="11" fill="#8b93a7">${t}</text>`;
    return `<svg viewBox="0 0 360 90" style="width:100%;max-width:420px;display:block;margin:8px auto">
      <line x1="24" y1="40" x2="336" y2="40" stroke="#8b93a7" stroke-width="2"/>
      <rect x="${X(v.from)}" y="34" width="${Math.max(2,X(v.to)-X(v.from))}" height="12" fill="rgba(94,234,212,.35)"/>
      <circle cx="${X(v.from)}" cy="40" r="6" ${v.closedLeft?'fill="#5eead4"':'fill="#0e121b" stroke="#5eead4"'} />
      <circle cx="${X(v.to)}" cy="40" r="6" ${v.closedRight?'fill="#5eead4"':'fill="#0e121b" stroke="#5eead4"'} />
      ${ticks}</svg>`;
  }
  if(v.kind==='bell'){
    const mu=v.mean,s=v.sd||1,min=mu-4*s,max=mu+4*s,N=70,xs=[],pdf=x=>Math.exp(-0.5*((x-mu)/s)**2);
    for(let i=0;i<=N;i++) xs.push(min+(i/N)*(max-min));
    const ys=xs.map(pdf), maxY=Math.max(...ys);
    const X=x=>20+((x-min)/(max-min))*320, Y=y=>152-(y/maxY)*120;
    const line=xs.map((x,i)=>(i?'L':'M')+X(x)+','+Y(ys[i])).join(' ');
    const k=v.shadeSd??1, a=mu-k*s,b=mu+k*s, sh=xs.filter(x=>x>=a&&x<=b);
    const shade=sh.length?('M'+X(sh[0])+',152 '+sh.map(x=>'L'+X(x)+','+Y(pdf(x))).join(' ')+' L'+X(sh.at(-1))+',152 Z'):'';
    return `<svg viewBox="0 0 360 180" style="width:100%;max-width:420px;display:block;margin:8px auto"><path d="${shade}" fill="rgba(94,234,212,.25)"/><path d="${line}" fill="none" stroke="#5eead4" stroke-width="2"/></svg>`;
  }
  if(v.kind==='scatter'){
    let seed=(v.seed+17)>>>0; const rng=()=>{seed=(1664525*seed+1013904223)>>>0; return seed/4294967296;};
    const gauss=()=>Math.sqrt(-2*Math.log(Math.max(1e-12,rng())))*Math.cos(2*Math.PI*rng());
    const rr=Math.max(-1,Math.min(1,v.r)); let pts='';
    for(let i=0;i<40;i++){ const x=gauss(), y=rr*x+Math.sqrt(Math.max(0,1-rr*rr))*gauss();
      const px=22+Math.max(.04,Math.min(.96,(x+3)/6))*276, py=12+(1-Math.max(.04,Math.min(.96,(y+3)/6)))*150;
      pts+=`<circle cx="${px}" cy="${py}" r="3.2" fill="#5eead4"/>`; }
    return `<svg viewBox="0 0 320 200" style="width:100%;max-width:420px;display:block;margin:8px auto"><rect x="22" y="12" width="276" height="150" fill="none" stroke="#252d3d"/>${pts}<text x="160" y="190" text-anchor="middle" fill="#8b93a7" font-size="11">r ≈ ${v.r}</text></svg>`;
  }
  return '';
}

function section(s){
  if(s.type==='intro') return `<p>${esc(s.body)}</p>`;
  if(s.type==='bullets') return `<h2>${esc(s.title)}</h2><ul>${s.items.map(i=>'<li>'+esc(i)+'</li>').join('')}</ul>`;
  if(s.type==='formula') return `<div class="card"><div class="stat-l">${esc(s.title)}</div><div style="color:var(--accent);font-family:ui-monospace,Consolas,monospace;margin-top:8px">${esc(s.formula)}</div>${s.note?'<p class="muted" style="font-size:13px">'+esc(s.note)+'</p>':''}</div>`;
  if(s.type==='example') return `<div class="ex"><div class="stat-l">${esc(s.title)}</div><p>${esc(s.setup)}</p><ol>${s.steps.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol><div class="ans">Answer: ${esc(s.answer)}</div></div>`;
  if(s.type==='shortcut') return `<aside class="call s"><h4>${esc(s.title||'C955 Shortcut')}</h4>${esc(s.body)}</aside>`;
  if(s.type==='trap') return `<aside class="call t"><h4>${esc(s.title||'Common Trap')}</h4>${esc(s.body)}</aside>`;
  if(s.type==='watch') return `<aside class="call w"><h4>Watch for this wording</h4>${(s.words||[]).map(w=>'<span class="badge">'+esc(w)+'</span> ').join('')}<p>${esc(s.body)}</p></aside>`;
  if(s.type==='visual') return visual(s.visual)+(s.caption?'<p class="subtle" style="text-align:center">'+esc(s.caption)+'</p>':'');
  if(s.type==='callout') return `<p class="call ${s.tone==='warn'?'w':s.tone==='tip'?'s':''}">${esc(s.body)}</p>`;
  return '';
}

function renderQuiz(){
  if(!quiz) return '<p>No quiz.</p>';
  if(quiz.phase==='done'){
    const right=quiz.log.filter(x=>x.ok).length, total=quiz.log.length, pct=total?Math.round(100*right/total):0;
    return `${quiz.spec.exam?'<p class="stat-l">C955 Practice Simulation — Not an Official WGU Exam</p>':''}
      <h1>Results</h1>
      <div class="cards"><div class="card"><div class="stat-l">Score</div><div class="stat-v">${right} / ${total}</div></div>
      <div class="card"><div class="stat-l">Percent</div><div class="stat-v">${pct}%</div></div></div>
      <div class="row"><a class="btn" href="#/quiz">Another quiz</a><a class="btn sec" href="#/learn">Review lessons</a></div>
      <h2 style="margin-top:28px">Question review</h2>
      <div class="list">${quiz.log.map((item,i)=>`<div class="item"><p><span class="muted">${i+1}.</span> ${esc(item.q.stem)}</p>
        <p>Your answer: <span style="color:${item.ok?'var(--ok)':'var(--bad)'}">${esc(item.chosen)}</span></p>
        ${item.ok?'':'<p>Correct: <b style="color:var(--accent)">'+esc(item.q.correct)+'</b></p>'}
        <ol>${item.q.steps.map(s=>'<li class="muted">'+esc(s)+'</li>').join('')}</ol></div>`).join('')}</div>`;
  }
  const q=quiz.qs[quiz.i]; if(!q) return '<p>Empty set.</p>';
  const letters=['A','B','C','D'];
  const show=quiz.phase==='feedback';
  return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <div><p class="stat-l">${esc(quiz.spec.title)}</p>${quiz.spec.exam?'<p class="subtle">C955 Practice Simulation — Not an Official WGU Exam</p>':''}</div>
      <div class="muted">${quiz.spec.timed?fmtTime(quiz.left)+' · ':''}${quiz.i+1} / ${quiz.qs.length}</div>
    </div>
    <div class="pro"><i style="width:${((quiz.i+(show?1:0))/quiz.qs.length)*100}%"></i></div>
    <div class="card" style="margin-top:16px">
      <span class="badge">${esc(DATA.CONCEPT_META[q.concept].title)}</span>
      <span class="badge">${q.difficulty}</span>
      <h2 style="margin-top:12px;font-size:22px">${esc(q.stem)}</h2>
      ${visual(q.visual)}
      <div style="display:grid;gap:8px;margin-top:16px">
        ${q.choices.map((c,i)=>`<button class="qbtn ${show&&c===q.correct?'ok':''} ${show&&c===quiz.chosen&&c!==q.correct?'bad':''}" data-choice="${encodeURIComponent(c)}"><span class="letter">${letters[i]}</span><span>${esc(c)}</span></button>`).join('')}
      </div>
      ${show? `<div style="margin-top:16px">
          <p style="color:${quiz.chosen===q.correct?'var(--ok)':'var(--bad)'};font-weight:600">${quiz.chosen===q.correct?'Correct.':'Not quite.'}</p>
          ${quiz.chosen===q.correct?'':'<p>Correct answer: <b style="color:var(--accent)">'+esc(q.correct)+'</b></p>'}
          <p class="stat-l">Why</p>
          <ol>${q.steps.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol>
          <aside class="call s"><h4>C955 Shortcut</h4>${esc(q.shortcut)}</aside>
          <aside class="call t"><h4>Common Trap</h4>${esc(q.trap)}</aside>
          <button class="btn" id="nextQ">${quiz.i+1>=quiz.qs.length?'See results':'Next'}</button>
        </div>`:''}
    </div>
    <div class="row" style="justify-content:flex-end"><a class="btn ghost" href="#/quiz">Exit</a></div>`;

function finishQuiz(){
  quiz.phase='done';
  const right=quiz.log.filter(x=>x.ok).length;
  const seconds=quiz.spec.timed? (quiz.spec.seconds||0)-quiz.left : Math.round((Date.now()-quiz.t0)/1000);
  if(quiz.mode!=='drill'){
    P.quizHistory=[{mode:quiz.mode,at:Date.now(),total:quiz.qs.length,correct:right,seconds,missedIds:quiz.log.filter(x=>!x.ok).map(x=>x.q.id)}, ...P.quizHistory].slice(0,30);
    if(quiz.mode==='exam') P.bestExamPct=Math.max(P.bestExamPct||0, quiz.qs.length? 100*right/quiz.qs.length:0);
    saveP();
  }
}

function onChoice(c){
  if(!quiz || quiz.chosen) return;
  const q=quiz.qs[quiz.i]; const ok=c===q.correct;
  quiz.chosen=c; record(q, ok, c); quiz.log.push({q, chosen:c, ok});
  if(quiz.spec.immediate){ quiz.phase='feedback'; render(); }
  else { nextQ(); }
}
function nextQ(){
  if(quiz.i+1>=quiz.qs.length){ finishQuiz(); render(); return; }
  quiz.i++; quiz.chosen=null; quiz.phase='ask'; render();
}

    <div class="card"><div class="stat-l">OR</div><div style="color:var(--accent);font-family:ui-monospace">P(A OR B) = P(A)+P(B)−P(A AND B)</div></div>
    <div class="card"><div class="stat-l">AND</div><div style="color:var(--accent);font-family:ui-monospace">P(A AND B) = P(A)×P(B|A)</div></div>
    <div class="card"><div class="stat-l">Conditional</div><div style="color:var(--accent);font-family:ui-monospace">P(A|B) = P(A AND B)/P(B) · GIVEN = denominator</div></div>
    <div class="card"><div class="stat-l">Independence</div><div style="color:var(--accent);font-family:ui-monospace">Independent ⇔ P(B)=P(B|A)</div></div>
    <div class="card"><div class="stat-l">Empirical rule</div><div style="color:var(--accent);font-family:ui-monospace">68% within 1 SD · 95% within 2 · 99.7% within 3</div></div>
    <div class="card"><div class="stat-l">Regression</div><div style="color:var(--accent);font-family:ui-monospace">ŷ = a + bx</div></div>
    <div class="card"><div class="stat-l">r</div><div style="color:var(--accent);font-family:ui-monospace">−1 ≤ r ≤ 1 · sign = direction · |r| = strength</div></div>
    <h2>Primes 1–25</h2><p>2, 3, 5, 7, 11, 13, 17, 19, 23. 1 is neither. 2 is the only even prime.</p>
    <h2>Placebo wording</h2><p class="muted">“Percentage of placebo participants who passed” → 28/41, never 28/grand total.</p>`;
}

function calcs(){
  return `<h1>Calculators</h1>
    ${panel('Basic probability', [['fav','Favorable','8'],['tot','Total','12']], 'bp')}
    ${panel('Percentage of a group', [['part','Part','28'],['whole','Group size','41']], 'pct')}
    ${panel('Conditional', [['both','Both / joint','20'],['given','Given group','45']], 'cd')}
    ${panel('Z-score', [['x','x','64'],['m','Mean','70'],['s','SD','3']], 'z')}
    ${panel('Regression ŷ = a + bx', [['a','Intercept a','5.2'],['b','Slope b','1.15'],['x2','x','50']], 'rg')}
    <div class="card"><h2>Mean & SD</h2><div class="field"><label>Numbers</label><input id="nums" value="4, 6, 8, 10, 12"></div>
    <p id="msOut" class="muted"></p></div>`;
}
function panel(title, fields, id){
  return `<div class="card"><h2>${title}</h2><div class="cards">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input data-calc="${id}" data-k="${f[0]}" value="${f[2]}"></div>`).join('')}</div><p class="ans" id="out-${id}"></p></div>`;
}
function updateCalcs(){
  const val=(id,k)=>{const el=document.querySelector('[data-calc="'+id+'"][data-k="'+k+'"]'); return el? Number(el.value):NaN;};
  const set=(id,t)=>{const el=document.getElementById('out-'+id); if(el) el.textContent=t;};
  const f=val('bp','fav'), t=val('bp','tot'); if(t>0) set('bp', f+'/'+t+' = '+(f/t).toFixed(4)+' = '+((100*f)/t).toFixed(1)+'%');
  const p=val('pct','part'), w=val('pct','whole'); if(w) set('pct', p+'/'+w+' × 100 = '+((100*p)/w).toFixed(1)+'%');
  const b=val('cd','both'), g=val('cd','given'); if(g) set('cd', b+'/'+g+' = '+(b/g).toFixed(4)+' = '+((100*b)/g).toFixed(1)+'%');
  const x=val('z','x'), m=val('z','m'), s=val('z','s'); if(s) set('z', 'z = ('+x+' − '+m+') / '+s+' = '+((x-m)/s).toFixed(4));
  const a=val('rg','a'), bb=val('rg','b'), x2=val('rg','x2'); if(Number.isFinite(a)) set('rg', 'ŷ = '+a+' + '+bb+'('+x2+') = '+(a+bb*x2));
  const numsEl=document.getElementById('nums'); if(numsEl){ const nums=numsEl.value.split(/[,\s]+/).map(Number).filter(Number.isFinite); const n=nums.length; const mean=n? nums.reduce((x,y)=>x+y,0)/n:0;
    const sd=n>1? Math.sqrt(nums.reduce((x,y)=>x+(y-mean)**2,0)/(n-1)):null;
    const o=document.getElementById('msOut'); if(o) o.textContent = n? ('mean = '+mean.toFixed(4)+(sd!=null?', sample SD = '+sd.toFixed(4):'')) : ''; }
}

function progressPage(){
  const a=acc(P.correct,P.attempted);
  return `<h1>Progress</h1><p class="muted">Stored in this browser only.</p>
    <div class="cards">
      <div class="card"><div class="stat-l">Attempted</div><div class="stat-v">${P.attempted}</div></div>
      <div class="card"><div class="stat-l">Correct</div><div class="stat-v">${P.correct}</div></div>
      <div class="card"><div class="stat-l">Accuracy</div><div class="stat-v">${a==null?'—':a+'%'}</div></div>
      <div class="card"><div class="stat-l">Streak</div><div class="stat-v">${P.streak}</div></div>
    </div>
    <h2 style="margin-top:28px">By concept</h2>
    <div class="list">${CONCEPTS.map(id=>{const c=P.byConcept[id]; const x=acc(c.correct,c.attempted);
      return `<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${esc(DATA.CONCEPT_META[id].title)}</b><div class="subtle">${c.attempted?c.correct+'/'+c.attempted:'No attempts yet'}</div></div><a class="btn" href="#/drill/${id}">Drill</a></div><div class="pro"><i style="width:${x||0}%"></i></div></div>`;}).join('')}</div>
    <div class="row"><button class="btn danger" id="resetBtn">Reset progress</button></div>`;
}

function page(){
  const path=hash();
  if(path==='/' || path==='') return dashboard();
  if(path==='/learn') return learnIndex();
  if(path.startsWith('/learn/')) return lesson(path.slice(7));
  if(path==='/quiz') return quizIndex();
  if(path.startsWith('/quiz/')) {
    const mode=path.slice(6);
    if(!quiz || quiz.mode!==mode || quiz._path!==path){ if(DATA.QUIZ_MODES[mode]) { quiz=pick(mode); quiz._path=path; } }
    return DATA.QUIZ_MODES[mode]? renderQuiz() : '<p>Unknown quiz.</p>';
  }
  if(path.startsWith('/drill/')) {
    const c=path.slice(7);
    if(!quiz || quiz._path!==path){ quiz=drill(c); quiz._path=path; }
    return renderQuiz();
  }
  if(path==='/flashcards') return cards();
  if(path==='/tricks') return tricks();
  if(path==='/cheatsheet') return sheet();
  if(path==='/calculators') return calcs();
  if(path==='/progress') return progressPage();
  return '<h1>Not found</h1><a class="btn" href="#/">Home</a>';
}

function bind(){
  const path=hash();
  document.querySelectorAll('.qbtn').forEach(b=>b.addEventListener('click',()=>onChoice(decodeURIComponent(b.dataset.choice))));
  const n=document.getElementById('nextQ'); if(n) n.onclick=nextQ;
  const f=document.getElementById('flipBtn'); if(f) f.onclick=()=>{fcFlip=!fcFlip; render();};
  const pc=document.getElementById('prevC'); if(pc) pc.onclick=()=>{fcI=(fcI-1+DATA.FLASHCARDS.length)%DATA.FLASHCARDS.length; fcFlip=false; render();};
  const nc=document.getElementById('nextC'); if(nc) nc.onclick=()=>{fcI=(fcI+1)%DATA.FLASHCARDS.length; fcFlip=false; render();};
  const sc=document.getElementById('shC'); if(sc) sc.onclick=()=>{fcOrder=shuffle(fcOrder); fcI=0; fcFlip=false; render();};
  const rb=document.getElementById('resetBtn'); if(rb) rb.onclick=()=>{ if(confirm('Reset all progress on this device?')){ P=defP(); saveP(); render(); } };
  if(path==='/calculators'){ document.querySelectorAll('[data-calc], #nums').forEach(el=>el.addEventListener('input', updateCalcs)); updateCalcs(); }
  const menu=document.getElementById('menuBtn'); const dr=document.getElementById('drawer');
  if(menu&&dr){ menu.onclick=()=>dr.classList.add('open'); dr.onclick=e=>{ if(e.target===dr) dr.classList.remove('open'); }; }
}

let timer=null;
function render(){
  const path=hash();
  document.getElementById('content').innerHTML = page();
  document.querySelectorAll('.side .nav a, .bot a').forEach(a=>{
    const href=a.getAttribute('href').slice(1);
    a.classList.toggle('active', path===href || (href!=='/' && path.startsWith(href)));
  });
  bind();
  if(quiz && quiz.spec && quiz.spec.timed && quiz.phase!=='done'){
    if(timer) clearInterval(timer);
    timer=setInterval(()=>{ if(!quiz||quiz.phase==='done'){clearInterval(timer);return;} quiz.left--; if(quiz.left<=0){ finishQuiz(); render(); } else {
      const el=document.querySelector('.main .muted'); if(el && quiz.spec.timed) render();
    }},1000);
  }
}
window.addEventListener('hashchange', ()=>{ quiz=null; if(hash().startsWith('/quiz/')||hash().startsWith('/drill/')) {} render(); });
setInterval(()=>{ P.studySeconds+=15; saveP(); }, 15000);
P.sessions += 1; P.lastSessionAt=Date.now(); saveP();
render();
</script>
